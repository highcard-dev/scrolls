[package]
name = "druid-minecraft-dashboard"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex-lite = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "=0.63.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
