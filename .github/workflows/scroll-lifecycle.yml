name: Shared Scroll lifecycle
on:
  workflow_call:
    inputs:
      public:
        description: Publish reviewed releases publicly; PR previews remain private.
        required: true
        type: boolean
permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and test Scroll UI
        working-directory: ui
        run: npm ci && npm test && npm run type-check && npm run build
      - name: Build scroll tree
        if: github.event_name == 'pull_request'
        run: make build-tree
      - name: Validate catalog and UI
        run: go run ./scripts/validate-release-workflow && go run ./scripts/validate-scrolls.go && bash ./scripts/validate_ui_coverage.sh
      - name: Test direct publication support
        run: go test ./scripts/stage-scroll-ui ./scripts/validate-release-workflow ./scripts/publish-owned -count=1
      - name: Test bounded catalog publication
        run: bash ./scripts/tests/push-parallel.test.sh
      - name: Check release inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]] && git diff --quiet "$BASE_SHA"...HEAD -- scrolls ui scripts .github/workflows go.mod go.sum Makefile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: verify
    if: >-
      needs.verify.outputs.changed == 'true' &&
      ((inputs.public && github.event_name != 'pull_request') ||
      (!inputs.public && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    # A fresh runner keeps publisher credentials out of the untrusted validation job.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ${{ inputs.public && 'scroll-release' || 'scroll-preview' }}
    concurrency:
      group: scroll-lifecycle-${{ inputs.public && 'release' || format('pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    steps:
      - name: Require provisioned lifecycle environment
        env:
          LIFECYCLE_READY: ${{ vars.SCROLL_LIFECYCLE_READY }}
        run: |
          if [[ "$LIFECYCLE_READY" != "true" ]]; then
            echo "Configure the protected lifecycle environment before publication." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout lifecycle-capable CLI
        uses: actions/checkout@v4
        with:
          repository: highcard-dev/druid-cli
          # Includes SOURCE_DATE_EPOCH and stable root-layer ordering.
          ref: a9f5dd9ec361ee5b268dfa5b5c2a56ef60f350fd
          path: .druid-cli
          token: ${{ secrets.GO_REPO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .druid-cli/go.mod
      - name: Build pinned CLI
        working-directory: .druid-cli
        run: |
          mkdir -p "$RUNNER_TEMP/scroll-cli"
          go build -o "$RUNNER_TEMP/scroll-cli/druid" ./apps/druid
          echo "$RUNNER_TEMP/scroll-cli" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build Scroll UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Build scroll tree
        if: github.event_name == 'pull_request'
        run: make build-tree
      - name: Validate with pinned CLI
        run: ./scripts/validate_all_scrolls.sh && bash ./scripts/validate_ui_coverage.sh
      - name: Push to publisher-owned registry repositories
        env:
          SCROLL_REGISTRY_HOST: ${{ vars.SCROLL_REGISTRY_HOST }}
          SCROLL_OWNER_ID: ${{ vars.SCROLL_OWNER_ID }}
          SCROLL_REGISTRY_RUNTIME_NAMESPACE: ${{ vars.SCROLL_REGISTRY_RUNTIME_NAMESPACE || 'druid-team' }}
          # Owner revisions embed presentation; category-only OCI artifacts are
          # not Scroll revisions and must not enter a publication snapshot.
          SCROLL_PUSH_CATEGORIES: '0'
          DRUID_SCROLL_RUNTIME_IMAGE: ${{ vars.DRUID_SCROLL_RUNTIME_IMAGE }}
          DRUID_SCROLL_STEAMCMD_IMAGE: ${{ vars.DRUID_SCROLL_STEAMCMD_IMAGE }}
          SCROLL_REGISTRY_USER: ${{ secrets.SCROLL_REGISTRY_USER }}
          SCROLL_REGISTRY_PASSWORD: ${{ secrets.SCROLL_REGISTRY_PASSWORD }}
          SCROLL_PUSH_MANIFEST: ${{ runner.temp }}/scroll-artifacts.txt
          SCROLL_LIFECYCLE_URL: ${{ vars.SCROLL_LIFECYCLE_URL }}
          SCROLL_AUTH_URL: ${{ vars.SCROLL_AUTH_URL }}
          SCROLL_PUBLISH_EMAIL: ${{ secrets.SCROLL_PUBLISH_EMAIL }}
          SCROLL_PUBLISH_PASSWORD: ${{ secrets.SCROLL_PUBLISH_PASSWORD }}
          SCROLL_LIFECYCLE_REVIEWED: ${{ vars.SCROLL_LIFECYCLE_REVIEWED }}
          SCROLL_PUBLIC: ${{ inputs.public && '1' || '0' }}
          SCROLL_TAG_SUFFIX: -${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for name in SCROLL_REGISTRY_HOST SCROLL_OWNER_ID SCROLL_REGISTRY_USER SCROLL_REGISTRY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required publisher setting: $name" >&2
              exit 1
            fi
          done
          if [[ "$SCROLL_PUBLIC" == "1" ]]; then
            go run ./scripts/publish-owned preflight
          fi
          : > "$SCROLL_PUSH_MANIFEST"
          bash ./scripts/push.sh
          if [[ "$SCROLL_PUBLIC" == "1" ]]; then
            go run ./scripts/publish-owned publish
          fi
